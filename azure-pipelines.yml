trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'

- script: |
    python -m venv venv
    source venv/bin/activate
    pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    source venv/bin/activate
    chmod +x scripts/run_behave.sh
    export ALLURE=true
    ./scripts/run_behave.sh
  displayName: 'Run behave tests with Allure'

- script: |
    source venv/bin/activate
    chmod +x scripts/generate_allure_report.sh
    ./scripts/generate_allure_report.sh || true
  displayName: 'Generate Allure HTML (if CLI available)'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'results'
    artifactName: 'behave-results'
    publishLocation: 'Container'
